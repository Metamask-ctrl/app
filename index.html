<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>应用下载中心</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --border: #e2e8f0;
            --badge-bg: #f1f5f9;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --card-bg: #1e293b;
                --text-main: #f8fafc;
                --text-sub: #94a3b8;
                --accent: #3b82f6;
                --accent-hover: #60a5fa;
                --border: #334155;
                --badge-bg: #0f172a;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            max-width: 600px;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        header p {
            color: var(--text-sub);
            font-size: 1rem;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: center;
        }

        .app-card {
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .app-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.15);
        }

        .app-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 14px;
        }

        .app-icon {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            object-fit: cover;
            background-color: var(--border);
        }

        .app-info h3 {
            font-size: 1.25rem;
            margin-bottom: 4px;
        }

        .app-meta {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .version {
            font-size: 0.8rem;
            color: var(--text-sub);
            background: var(--badge-bg);
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .platform-badge {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent);
        }

        .app-desc {
            color: var(--text-sub);
            font-size: 0.92rem;
            line-height: 1.6;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .download-btn {
            flex: 1;
            min-width: 120px;
            text-align: center;
            background-color: var(--accent);
            color: #ffffff;
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }

        .download-btn:hover {
            background-color: var(--accent-hover);
        }

        .download-btn.secondary {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        .download-btn.secondary:hover {
            background-color: var(--badge-bg);
        }

        footer {
            margin-top: auto;
            padding-top: 50px;
            color: var(--text-sub);
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>应用下载中心</h1>
        <p>提供 Android 最新版本客户端下载</p>
    </header>

    <main class="container">

        <!-- PCloud Android 版本 -->
        <div class="app-card">
            <div>
                <div class="app-header">
                    <img src="https://api.dicebear.com/7.x/shapes/svg?seed=PCloudAndroid" alt="Icon" class="app-icon">
                    <div class="app-info">
                        <h3>PCloud for Android</h3>
                        <div class="app-meta">
                            <span class="platform-badge">Android</span>
                            <span class="version">v1.1.5</span>
                        </div>
                    </div>
                </div>
                <p class="app-desc">适用于 Android 8.0 及以上版本手机与平板设备。</p>
            </div>
            <div class="btn-group">
                <a href="https://drive.mtd.dpdns.org/raw/v1.0.21/pan-client-arm64-v8a-release_signed-signed.apk" class="download-btn" target="_blank">直接下载 arm-v8a (.apk)</a>
                <a href="https://drive.mtd.dpdns.org/raw/v1.0.21/pan-client-armeabi-v7a-release_signed-signed.apk" class="download-btn secondary" target="_blank">直接下载 arm-v7a (.apk)</a>
            </div>
        </div>

    </main>

    <footer>
        <p>© 2026 PCloud Application Center. Powered by GitHub Pages.</p>
    </footer>

</body>
</html>
